version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      android-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.lifecycle:*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "androidx.core:*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # These lines require API 37 / AGP 9; keep API 36 until the toolchain migration.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.09.00"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">=2.10.0"]
      - dependency-name: "io.coil-kt.coil3:*"
        versions: [">=3.6.0"]
      - dependency-name: "io.ktor:*"
        versions: [">=3.6.0"]
      - dependency-name: "io.github.jan-tennert.supabase:bom"
        versions: [">=3.9.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
